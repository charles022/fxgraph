<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rkyv + WebSocket demo</title>
  <style>
    :root {
      font-family: "Fira Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, #1b2735, #0b1118 60%);
      color: #f5f5f5;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .card {
      width: min(760px, 100%);
      border-radius: 16px;
      padding: 24px 28px;
      background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(6px);
    }
    h1 {
      margin: 0 0 12px;
      letter-spacing: 0.5px;
      font-size: 24px;
    }
    p { color: #b7c4d5; margin: 0 0 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }
    .stat {
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .stat label { display: block; color: #8da0b8; font-size: 12px; letter-spacing: 0.4px; }
    .stat strong { font-size: 24px; }
    #positions { margin-top: 16px; display: grid; gap: 10px; }
    .pos {
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
    }
    #status { margin-top: 10px; font-size: 13px; color: #7f93a5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Shared Struct over WebSocket</h1>
    <p>Server archives a Rust <code>GameState</code> with rkyv and streams it to this page via a binary WebSocket frame.</p>
    <div class="grid">
      <div class="stat"><label>Tick</label><strong id="tick">–</strong></div>
      <div class="stat"><label>Score</label><strong id="score">–</strong></div>
      <div class="stat"><label>Positions</label><strong id="positions-count">–</strong></div>
    </div>
    <div id="positions"></div>
    <div id="status">Waiting for wasm to load…</div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
