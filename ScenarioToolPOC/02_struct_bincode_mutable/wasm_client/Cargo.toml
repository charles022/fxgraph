[package]
name = "wasm_client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
bincode = "1"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
shared = { path = "../shared" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Document", "Element", "Headers", "HtmlElement", "Request", "RequestInit", "RequestMode", "Response", "Window"] }
