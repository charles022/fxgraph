<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shared struct over bincode + WASM</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Fira Sans", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0e1a2b, #1c2f4d 40%, #0e1a2b 80%);
      color: #e8f0ff;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: min(900px, 90vw);
      background: rgba(13, 18, 31, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
      border-radius: 16px;
      padding: 32px;
    }
    h1 { margin-top: 0; letter-spacing: 0.5px; }
    p { color: #b5c7e0; line-height: 1.6; }
    .cta {
      margin: 20px 0;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    button {
      background: #7ce7ff;
      color: #0b1625;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(124, 231, 255, 0.35);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(124, 231, 255, 0.45); }
    button:active { transform: translateY(0); }
    #profile {
      background: #0a1322;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      white-space: pre-wrap;
      min-height: 72px;
      letter-spacing: 0.2px;
    }
    .status { font-weight: 700; color: #7ce7ff; }
  </style>
</head>
<body>
  <main>
    <h1>Mutable player profile fetched over bincode</h1>
    <p>This page pulls a <code>PlayerProfile</code> from <code>/profile</code> as a bincode blob, deserializes it in WASM, and mutates the inventory client-side.</p>
    <div class="cta">
      <button id="load">Pull profile</button>
      <span class="status" id="status">waiting for wasm...</span>
    </div>
    <div id="profile">No profile loaded yet.</div>
  </main>
  <script type="module">
    import init, { pull_profile } from "./pkg/wasm_client.js";

    const status = document.getElementById("status");
    const button = document.getElementById("load");

    async function bootstrap() {
      status.textContent = "loading wasm bundle…";
      await init();
      status.textContent = "ready";
      button.disabled = false;
    }

    button.addEventListener("click", async () => {
      status.textContent = "fetching /profile…";
      try {
        await pull_profile();
        status.textContent = "profile loaded and mutated";
      } catch (err) {
        console.error(err);
        status.textContent = "failed to fetch profile";
      }
    });

    bootstrap();
  </script>
</body>
</html>
