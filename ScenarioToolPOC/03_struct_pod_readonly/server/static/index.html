<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bytemuck POD snapshot</title>
  <style>
    :root {
      --bg: #0a1625;
      --panel: rgba(15, 28, 46, 0.9);
      --border: rgba(255, 255, 255, 0.08);
      --muted: #9cb4cc;
      --accent: #8ef0c2;
      --accent-2: #5cc8ff;
      font-family: "Sora", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #e9f2ff;
      background: radial-gradient(circle at 20% 20%, #11243c, #07101c 60%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .card {
      width: min(900px, 100%);
      padding: 28px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--panel), rgba(10, 22, 37, 0.85));
      border: 1px solid var(--border);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(6px);
    }
    h1 { margin: 0 0 12px; font-size: 26px; letter-spacing: 0.6px; }
    p { margin: 0 0 18px; color: var(--muted); line-height: 1.6; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin: 16px 0;
    }
    .stat {
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
    }
    .stat label { display: block; color: var(--muted); font-size: 12px; letter-spacing: 0.4px; }
    .stat strong { font-size: 24px; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
    }
    button {
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #03101b;
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 160ms ease;
      box-shadow: 0 12px 30px rgba(94, 223, 194, 0.35);
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 16px 40px rgba(94, 223, 194, 0.45); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    #status { color: var(--muted); font-size: 14px; }
    code { color: var(--accent-2); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Fixed-size POD over HTTP</h1>
    <p>The server exposes <code>/snapshot</code> as raw bytes. The WASM client casts those bytes to <code>PhysicsState</code> with <code>bytemuck::from_bytes</code> and renders them without allocating.</p>
    <div class="grid">
      <div class="stat"><label>Entity ID</label><strong id="id">–</strong></div>
      <div class="stat"><label>Position X</label><strong id="x">–</strong></div>
      <div class="stat"><label>Position Y</label><strong id="y">–</strong></div>
      <div class="stat"><label>Sum (x + y)</label><strong id="sum">–</strong></div>
    </div>
    <div class="actions">
      <button id="fetch" disabled>Fetch snapshot</button>
      <span id="status">Booting wasm…</span>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
