[package]
name = "merge_table_fixed_poc"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
bytemuck = { version = "1", features = ["derive"] }
futures = "0.3"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std"] }
