[package]
name = "fxgraph-client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "console", 
    "Window", 
    "Document", 
    "HtmlCanvasElement", 
    "CanvasRenderingContext2d", 
    "WebSocket", 
    "MessageEvent", 
    "ErrorEvent",
    "Element"
] }
getrandom = { version = "0.3", features = ["wasm_js"] }
fxgraph-shared = { path = "../shared" }

